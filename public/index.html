<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vercel + Render + Neon — Тестовая доска заметок</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #121824;
      --surface-2: #192232;
      --border: #253147;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --accent: #00e599;
      --accent-dark: #00b87a;
      --danger: #ff5c7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #131c2e 0%, var(--bg) 55%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 36px 16px;
    }
    .container {
      width: 100%;
      max-width: 720px;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }
    .pill {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      color: var(--muted);
    }
    .pill a {
      color: var(--accent);
      text-decoration: none;
    }
    .pill a:hover {
      text-decoration: underline;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ok {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .dot.err {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .tab-btn.active {
      background: rgba(0, 229, 153, 0.14);
      border-color: var(--accent);
      color: var(--accent);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    form {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92rem;
      transition: opacity 0.15s, background 0.15s;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      padding: 11px 18px;
      background: var(--accent);
      color: #05140e;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dark);
    }
    .btn-del {
      padding: 6px 11px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }
    .btn-del:hover:not(:disabled) {
      border-color: var(--danger);
      color: var(--danger);
    }
    .error-msg {
      margin-top: 10px;
      color: var(--danger);
      font-size: 0.88rem;
      min-height: 1.1em;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .note-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .note-body {
      min-width: 0;
      flex: 1;
    }
    .note-text {
      margin: 0 0 4px 0;
      word-break: break-word;
      font-size: 0.96rem;
    }
    .note-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 20px 0;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Vercel + Render + Neon — Тестовая доска заметок</h1>
      <div class="pill" id="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Подключение…</span>
        <span id="status-link"></span>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Выбор бэкенда">
      <button class="tab-btn active" type="button" data-mode="render">
        Render (Backend + Postgres)
      </button>
      <button class="tab-btn" type="button" data-mode="neon">
        Neon (Vercel Serverless + Neon)
      </button>
    </div>

    <section class="card">
      <form id="note-form">
        <input
          id="note-input"
          type="text"
          maxlength="280"
          placeholder="Напишите тестовую заметку (до 280 символов)…"
          required
        />
        <button class="btn-primary" id="submit-btn" type="submit">Добавить</button>
      </form>
      <div class="error-msg" id="error-msg"></div>
    </section>

    <section class="card">
      <div class="notes-list" id="notes-list">
        <div class="empty">Загрузка заметок…</div>
      </div>
    </section>
  </main>

  <script>
    const MODES = {
      render: {
        endpoint: '/api/render-notes',
        connectingText: 'Подключение к Render (если сервис спал, подождите до 30–50 сек)…',
        label: 'Render Web Service → Render Postgres',
      },
      neon: {
        endpoint: '/api/notes',
        connectingText: 'Подключение к Neon Postgres…',
        label: 'Vercel Serverless → Neon Postgres',
      },
    };

    let activeMode = 'render';

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusLink = document.getElementById('status-link');
    const notesList = document.getElementById('notes-list');
    const noteForm = document.getElementById('note-form');
    const noteInput = document.getElementById('note-input');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');
    const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));

    function setStatus(state, text, renderUrl) {
      statusDot.className = 'dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
      statusText.textContent = text;
      statusLink.replaceChildren();
      if (renderUrl && typeof renderUrl === 'string' && renderUrl.startsWith('https://')) {
        const sep = document.createTextNode(' • ');
        const link = document.createElement('a');
        link.href = renderUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Render API';
        statusLink.appendChild(sep);
        statusLink.appendChild(link);
      }
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString('ru-RU');
      } catch {
        return String(iso);
      }
    }

    function renderNotes(notes) {
      notesList.replaceChildren();
      if (!notes || notes.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Заметок пока нет. Добавьте первую выше!';
        notesList.appendChild(empty);
        return;
      }

      for (const note of notes) {
        const item = document.createElement('div');
        item.className = 'note-item';

        const body = document.createElement('div');
        body.className = 'note-body';

        const textEl = document.createElement('p');
        textEl.className = 'note-text';
        textEl.textContent = note.text;

        const metaEl = document.createElement('div');
        metaEl.className = 'note-meta';
        metaEl.textContent = '#' + note.id + ' • ' + formatDate(note.created_at);

        body.appendChild(textEl);
        body.appendChild(metaEl);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.type = 'button';
        delBtn.textContent = 'Удалить';
        delBtn.addEventListener('click', () => deleteNote(note.id, delBtn));

        item.appendChild(body);
        item.appendChild(delBtn);
        notesList.appendChild(item);
      }
    }

    async function loadNotes() {
      const cfg = MODES[activeMode];
      const requestedMode = activeMode;
      errorMsg.textContent = '';
      setStatus('loading', cfg.connectingText, null);

      try {
        const res = await fetch(cfg.endpoint);
        const data = await res.json();
        if (requestedMode !== activeMode) return;
        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Ошибка загрузки');
        }
        setStatus(
          'ok',
          cfg.label + ' • ' + formatDate(data.dbTime),
          activeMode === 'render' ? data.renderUrl : null
        );
        renderNotes(data.notes);
      } catch (err) {
        if (requestedMode !== activeMode) return;
        setStatus('err', 'Ошибка подключения к БД', null);
        errorMsg.textContent = err.message;
      }
    }

    async function deleteNote(id, btn) {
      const cfg = MODES[activeMode];
      btn.disabled = true;
      errorMsg.textContent = '';
      try {
        const res = await fetch(cfg.endpoint + '?id=' + encodeURIComponent(id), {
          method: 'DELETE',
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Не удалось удалить заметку');
        }
        await loadNotes();
      } catch (err) {
        errorMsg.textContent = err.message;
        btn.disabled = false;
      }
    }

    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = noteInput.value.trim();
      if (!text) return;

      const cfg = MODES[activeMode];
      submitBtn.disabled = true;
      errorMsg.textContent = '';
      try {
        const res = await fetch(cfg.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Не удалось сохранить заметку');
        }
        noteInput.value = '';
        await loadNotes();
      } catch (err) {
        errorMsg.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    for (const btn of tabButtons) {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        if (!mode || mode === activeMode) return;
        activeMode = mode;
        for (const other of tabButtons) {
          other.classList.toggle('active', other.dataset.mode === activeMode);
        }
        notesList.replaceChildren();
        const loadingEl = document.createElement('div');
        loadingEl.className = 'empty';
        loadingEl.textContent = 'Загрузка заметок…';
        notesList.appendChild(loadingEl);
        loadNotes();
      });
    }

    loadNotes();
  </script>
</body>
</html>
